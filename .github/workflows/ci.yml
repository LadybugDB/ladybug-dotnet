name: CI

# Fast validation for the C# binding, driven by the Cake Frosting pipeline in cake/.
#   - test: builds both target frameworks, stages the host RID's prebuilt engine library, and runs the
#           full suite with native skips disabled.
#   - pack: produces and validates the whole package family (managed + per-RID native + meta) without
#           publishing.
#
# Native engine libraries are downloaded as prebuilt `liblbug-*` release assets from the upstream engine
# repo (LadybugDB/ladybug); the release is pinned via version.txt at the binding root.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'cake/**'
      - 'nuget/**'
      - '**/*.props'
      - 'version.txt'
      - 'LadybugDB.slnx'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'cake/**'
      - 'nuget/**'
      - '**/*.props'
      - 'version.txt'
      - 'LadybugDB.slnx'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build + test (stages the host native engine, no skips)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project cake/LadybugDB.Build.csproj -- --target Test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack the full package family and verify contents (no publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project cake/LadybugDB.Build.csproj -- --target Pack

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
